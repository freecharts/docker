# Pgpool-II client authentication configuration

# Local connections via Unix socket - trust
local   all             all                             trust

# Localhost TCP connections - trust
host    all             all     127.0.0.1/32            trust
host    all             all     ::1/128                 trust

# All users from any host - md5 authentication using pool_passwd
host    all             all     0.0.0.0/0               trust
host    all             all     ::/0                    trust
